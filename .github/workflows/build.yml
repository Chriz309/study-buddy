name: Build & Release

# main  -> builds AND publishes a public GitHub Release (installed apps auto-update).
# dev   -> builds a private test installer uploaded as a workflow artifact only
#          (NO release, so active users get NO update popup while we iterate).
on:
  push:
    branches: [main, dev]
    paths: ['src/**', 'assets/**', 'package.json', 'electron-builder.yml']
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write      # needed to upload Release assets (main only)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # no package-lock.json committed, so install (not ci) and no npm cache
      - run: npm install --no-audit --no-fund

      # main: publish a public Release (tag v<version>) so installed apps update.
      - name: Build & publish release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      # dev (or any other branch / manual run): build only, never publish.
      - name: Build test installer (dev — no release)
        if: github.ref != 'refs/heads/main'
        run: npx electron-builder --win --publish never

      # Always expose the built installer as a downloadable artifact.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: study-buddy-win
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore
