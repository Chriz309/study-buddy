name: Build & Release

# Tag a version to cut a release:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # also allow manual runs (build only, no release)

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write      # needed to upload the Release assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # On a tag push, electron-builder publishes to the GitHub Release.
      # On a manual run it just builds the artifacts.
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: study-buddy-win
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore
