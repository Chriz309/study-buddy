<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data: file:;" />
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; cursor: default; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10; }
#face { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 11; will-change: transform; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 14; }
#chute { position: absolute; left: 0; top: 0; z-index: 13; display: none; pointer-events: none; will-change: left, top, width; filter: drop-shadow(0 4px 5px rgba(0,0,0,.2)); }
#food { position: absolute; left: 0; top: 0; z-index: 12; display: none; pointer-events: none; will-change: left, top, width; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
#speech { position: absolute; left: 0; top: 0; z-index: 15; pointer-events: none;
          background: #fff; color: #20263b; font-size: 13px; font-weight: 600; line-height: 1.25;
          padding: 8px 11px; border-radius: 13px; width: max-content; max-width: 220px; text-align: center;
          box-shadow: 0 6px 18px rgba(0,0,0,.22); border: 2px solid #ffd23f; transform: translate(-50%,-100%);
          opacity: 0; transition: opacity .18s ease; }
#speech.show { opacity: 1; }
#speech::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 7px solid transparent; border-top-color: #fff; }
.heart { position: absolute; font-size: 22px; pointer-events: none; animation: rise 1s ease-out forwards; }
@keyframes rise { 0% { opacity: 1; transform: translateY(0) scale(.6);} 100% { opacity: 0; transform: translateY(-48px) scale(1.2);} }
.zzz { position: absolute; font-size: 18px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.4); pointer-events: none; animation: zfloat 1.9s ease-out forwards; font-weight: 800; }
/* arcade fx for Captain Cram: dust puff, sparkle, +1 INT! pop-up, cape/speed trail */
.smoke { position: absolute; background: #3a3a40; pointer-events: none; image-rendering: pixelated; animation: smoke 1.1s ease-out forwards; }
@keyframes smoke { 0% { opacity: .9; transform: translate(0,0) scale(.7);} 100% { opacity: 0; transform: translate(var(--dx),-52px) scale(1.7);} }
.dust { position: absolute; background: #cbb89a; pointer-events: none; image-rendering: pixelated; animation: dust .6s ease-out forwards; }
@keyframes dust { 0% { opacity: .95; transform: translate(0,0) scale(1);} 100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(.4);} }
.sparkle { position: absolute; pointer-events: none; image-rendering: pixelated; animation: sparkle .75s steps(6) forwards;
           background: #fff; box-shadow: 0 0 0 1px #ffd23f; }
@keyframes sparkle { 0% { opacity: 1; transform: translate(0,0) scale(1) rotate(45deg);} 100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(.2) rotate(45deg);} }
.pop { position: absolute; pointer-events: none; transform: translateX(-50%); white-space: nowrap; font-family: "Courier New", monospace; font-weight: 900; color: #ffe14d;
       text-shadow: -1px -1px 0 #7a1f00, 1px -1px 0 #7a1f00, -1px 1px 0 #7a1f00, 1px 1px 0 #7a1f00, 0 2px 0 #7a1f00; animation: pop 1.7s steps(14) forwards; }
@keyframes pop { 0% { opacity: 0; margin-top: 0;} 12% { opacity: 1;} 80% { opacity: 1;} 100% { opacity: 0; margin-top: -34px;} }
#trail { position: absolute; left: 0; top: 0; z-index: 9; display: none; pointer-events: none; }
#trail i { position: absolute; display: block; image-rendering: pixelated; animation: tflick .16s steps(2) infinite alternate; }
@keyframes tflick { from { transform: scale(1); opacity: 1;} to { transform: scale(var(--ts,.7)); opacity: .75;} }
@keyframes zfloat { 0% { opacity: 0; transform: translate(0,0) scale(.6);} 20% { opacity: 1;} 100% { opacity: 0; transform: translate(16px,-42px) scale(1.1);} }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <svg id="face"></svg>
  <img id="chute" />
  <img id="food" />
  <div id="trail"></div>
  <div id="fx"></div>
  <div id="speech"></div>
  <script src="../shared/backoff.js"></script>
  <script src="art.js"></script>
  <script src="art-ghost.js"></script>
  <script src="art-cat.js"></script>
  <script src="art-cat-mischief.js"></script>
  <script src="art-hero.js"></script>
  <script src="parachute.js"></script>
  <script src="food.js"></script>
  <script src="jelly.js"></script>
  <script src="face.js"></script>
  <script src="lines.js"></script>
  <script src="app.js"></script>
</body>
</html>
