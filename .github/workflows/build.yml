name: Build & Release

# Tag a version to cut a release:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # also allow manual runs (build only, no release)

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write      # needed to upload the Release assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # no package-lock.json committed, so install (not ci) and no npm cache
      - run: npm install --no-audit --no-fund

      # Publishes a GitHub Release (tagged v<version> from package.json) and
      # uploads the installer. Runs on a tag push OR a manual "Run workflow".
      - name: Build & publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: study-buddy-win
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore
